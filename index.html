<!DOCTYPE html>
<html>
<head><title>ARSLAN-MD MINI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0f0f0f;color:#fff;font-family:sans-serif;text-align:center;padding:30px}
input{padding:12px;width:80%;border-radius:10px;border:none;font-size:18px;text-align:center}
button{padding:12px 25px;margin-top:15px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:18px}
#code{font-size:35px;letter-spacing:5px;color:#25D366;margin-top:20px;font-weight:bold}
</style></head>
<body>
<h1>ARSLAN-MD 💜 MINI</h1>
<p>Apna number likho 923xx</p>
<input id="num" placeholder="923467214839" />
<br><button onclick="getCode()">GET PAIRING CODE</button>
<div id="code"></div>
<p id="msg"></p>
<script>
async function getCode(){
  const number = document.getElementById("num").value;
  document.getElementById("msg").innerText = "Ruko... code aa raha hai...";
  const res = await fetch("/api/pair", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({number})});
  const data = await res.json();
  if(data.code){
    document.getElementById("code").innerText = data.code;
    document.getElementById("msg").innerText = "Ab WhatsApp me ja ke ye code daal do, 30 sec ke andar!";
  } else {
    document.getElementById("msg").innerText = "Error: " + (data.error || "Phir try karo");
  }
}
</script>
</body>
</html>
